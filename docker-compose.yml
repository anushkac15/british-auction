x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://auction:auction@postgres:5432/auction
  TEST_DATABASE_URL: postgresql+psycopg://auction:auction@postgres:5432/auction_test
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:3000,http://localhost:5173
  SWEEP_INTERVAL_SECONDS: "15"
  SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
  SEED_DEMO_USERS: "true"
  LOGIN_THROTTLE_STORE: redis

x-backend-build: &backend-build
  context: ./backend
  args:
    INSTALL_DEV: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: *backend-build
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: *backend-build
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: *backend-build
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
