# Render Blueprint for a free demo: New > Blueprint in the Render dashboard, then pick this repository.
#
#   React (static site) -> FastAPI -> PostgreSQL
#                             |
#                           Redis (failed-login counts)
#
# No Celery worker runs here: auction status is resolved from the server clock on every read and bid,
# and opening an RFQ persists any missed transitions. docker-compose.yml runs the dedicated worker.
#
# If Render gives the API a different URL than https://british-auction-api.onrender.com
# (the name was taken), update the /api/* rewrite on british-auction-web to match.

databases:
  - name: british-auction-db
    databaseName: auction
    user: auction
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: british-auction-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: british-auction-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOGIN_THROTTLE_STORE
        value: redis
      - key: DATABASE_URL
        fromDatabase:
          name: british-auction-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: british-auction-redis
          property: connectionString

  - type: web
    name: british-auction-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://british-auction-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
