# Production stack for a single server (e.g. an Oracle Cloud Always Free VM).
#   cp .env.production.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside (ports 80/443); it gets the HTTPS certificate automatically.

name: british-auction

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://auction:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/auction
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  CORS_ORIGINS: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}
  SWEEP_INTERVAL_SECONDS: "15"
  WEB_CONCURRENCY: "2"
  LOGIN_THROTTLE_STORE: redis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: auction
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
