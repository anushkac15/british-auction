server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Using a variable in proxy_pass makes nginx re-resolve "api" instead of caching the
    # address from startup, which goes stale whenever the api container restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Server-sent events: no buffering, long-lived connection.
    location ~ ^/api/rfqs/\d+/stream$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
